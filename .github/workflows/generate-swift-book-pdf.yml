name: Generate Swift Book PDF

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional specific commit SHA of swift-book to build from'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  build-pdf:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone swift-book repo and determine target
        id: target
        run: |
          # Clone the repository
          git clone https://github.com/swiftlang/swift-book.git swift-book-repo
          cd swift-book-repo
          
          # Determine which commit to build
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            echo "Using manually provided SHA: ${{ github.event.inputs.sha }}"
            git checkout ${{ github.event.inputs.sha }}
          else
            echo "Fetching latest commit from main branch..."
            git fetch origin main
            git checkout origin/main
          fi
          
          # Get the actual commit SHA
          TARGET_SHA=$(git rev-parse HEAD)
          TARGET_SHA_SHORT=$(git rev-parse --short=7 HEAD)
          COMMIT_MSG=$(git log -1 --format=%B)
          TAG_NAME=$(git tag --points-at HEAD | head -n 1)
          
          echo "Target SHA: $TARGET_SHA_SHORT"
          echo "Commit message: $(echo "$COMMIT_MSG" | head -n 1)"
          echo "Tag: $TAG_NAME"
          
          # Save to environment variables
          echo "TARGET_SHA=$TARGET_SHA" >> $GITHUB_ENV
          echo "TARGET_SHA_SHORT=$TARGET_SHA_SHORT" >> $GITHUB_ENV
          echo "COMMIT_MSG<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Calculate tag directory path if tag exists
          if [ -n "$TAG_NAME" ]; then
            TAG_DIR_PATH=$(echo "$TAG_NAME" | sed -E 's/^swift-//; s/^([0-9]+)(-)/\1.0\2/; s/-(fcs|beta-.*)/\/\1/')
            echo "TAG_DIR_PATH=$TAG_DIR_PATH" >> $GITHUB_ENV
          fi
          
          # Go back to root directory
          cd ..

      - name: Download SF Pro Fonts DMG
        run: curl -L -o SF-Pro.dmg https://developer.apple.com/download/files/SF-Pro.dmg

      - name: Mount DMG and install SF Pro fonts
        run: |
          hdiutil attach SF-Pro.dmg -mountpoint /Volumes/SFPro
          sudo installer -pkg "/Volumes/SFPro/SF Pro Fonts.pkg" -target /
          hdiutil detach /Volumes/SFPro

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install swift-book-pdf

      - name: Install TeX Live (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/texlive
            ~/.texlive2025
          key: texlive-2025-${{ runner.os }}-${{ hashFiles('.github/workflows/generate-swift-book-pdf.yml') }}
          restore-keys: |
            texlive-2025-${{ runner.os }}-

      - name: Install TeX Live and required packages
        run: |
          set -e
          YEAR=2025
          TEXDIR="$HOME/texlive/${YEAR}"
          export PATH="$TEXDIR/bin/universal-darwin:$PATH"
          if ! command -v tlmgr >/dev/null 2>&1; then
            curl -L -o install-tl-unx.tar.gz http://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
            tar -xzf install-tl-unx.tar.gz
            INSTALL_DIR=$(find . -maxdepth 1 -type d -name 'install-tl-*' | head -n 1)
            cd "$INSTALL_DIR"
            printf '%s\n' \
              'selected_scheme scheme-small' \
              "TEXDIR $TEXDIR" \
              "TEXMFCONFIG $HOME/.texlive2025/texmf-config" \
              "TEXMFHOME $HOME/texmf" \
              "TEXMFLOCAL $HOME/texlive/texmf-local" \
              "TEXMFSYSCONFIG $TEXDIR/texmf-config" \
              "TEXMFSYSVAR $TEXDIR/texmf-var" \
              "TEXMFVAR $HOME/.texlive2025/texmf-var" \
              'option_doc 0' \
              'option_src 0' \
              > texlive.profile
            ./install-tl -profile texlive.profile
            cd ..
          fi
          tlmgr update --self || true
          REQUIRED_PKGS="fontspec xcolor graphics fancyhdr geometry adjustbox ifoddpage enumitem listings minted tcolorbox pgf needspace hyperref parskip tabulary ragged2e footmisc lua-ul pdfcol tikzfill bigfoot"
          tlmgr install $REQUIRED_PKGS || true
          tlmgr path add
          echo "$TEXDIR/bin/universal-darwin" >> $GITHUB_PATH

      - name: Generate PDF
        run: |
          mkdir -p archive

          run_quiet() {
            if [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
              "$@"
            else
              "$@" > /dev/null 2>&1
            fi
          }

          echo "Generating digital light mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo --no-gutter archive/latest/swift_book.pdf

          if [ -n "$TAG_DIR_PATH" ]; then
            TAG_DIR="archive/$TAG_DIR_PATH"
            mkdir -p "$TAG_DIR"
            cp archive/latest/swift_book.pdf "$TAG_DIR"/
            echo "Also copied PDF to $TAG_DIR"
          fi

          echo "PDF generated successfully!"

      - name: Update release manifest
        run: python3 .github/automation/scripts/update-release-manifest.py --sha "$TARGET_SHA" --upstream-repo swift-book-repo

      - name: Regenerate README index
        run: python3 .github/automation/scripts/generate-index.py

      - name: Regenerate folder READMEs
        run: python3 .github/automation/scripts/generate-folder-readmes.py

      - name: Commit and push PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive/latest/swift_book.pdf || true
          if [ -n "$TAG_DIR_PATH" ]; then
            git add "archive/$TAG_DIR_PATH/swift_book.pdf" || true
          fi
          git add archive/README.md archive/*/README.md archive/*/*/README.md || true
          git add .github/automation/releases.json README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COMMIT_MSG=$(printf "Swift Book upstream: %s\n%s\n\nUpstream commit: https://github.com/swiftlang/swift-book/commit/%s" "$TARGET_SHA_SHORT" "$COMMIT_MSG" "$TARGET_SHA")
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag commit if upstream is tagged
        if: env.TAG_NAME != ''
        run: |
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create release and upload PDF if upstream is tagged
        if: env.TAG_NAME != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: |
            Release for Swift Book upstream tag ${{ env.TAG_NAME }}

            https://github.com/swiftlang/swift-book/releases/tag/${{ env.TAG_NAME }}
          files: |
            archive/${{ env.TAG_DIR_PATH }}/swift_book.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
