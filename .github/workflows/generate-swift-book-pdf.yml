name: Generate Swift Book PDFs

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional specific commit SHA of swift-book to build from'
        required: false

permissions:
  contents: write
  actions: read

jobs:
  generate-pdfs:
    runs-on: macos-latest
    outputs:
      target_sha: ${{ steps.fetch_target.outputs.latest_sha }}
      target_sha_short: ${{ steps.fetch_target.outputs.latest_sha_short }}
      tag_name: ${{ steps.fetch_target.outputs.tag_name }}
      tag_dir_path: ${{ steps.fetch_target.outputs.tag_dir_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch target commit info
        id: fetch_target
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            INPUT_SHA_SHORT=$(echo "$INPUT_SHA" | cut -c1-7)
            echo "Using manually provided SHA: $INPUT_SHA_SHORT"
            COMMIT_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_API_TOKEN" \
              "https://api.github.com/repos/swiftlang/swift-book/commits/$INPUT_SHA")
          else
            echo "Fetching latest commit from main..."
            COMMIT_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_API_TOKEN" \
              "https://api.github.com/repos/swiftlang/swift-book/commits?sha=main&per_page=1")
            COMMIT_JSON=$(echo "$COMMIT_JSON" | jq '.[0]')
          fi

          LATEST_SHA=$(echo "$COMMIT_JSON" | jq -r '.sha')
          LATEST_SHA_SHORT=$(echo "$LATEST_SHA" | cut -c1-7)
          LATEST_MSG=$(echo "$COMMIT_JSON" | jq -r '.commit.message')

          echo "Target SHA: $LATEST_SHA_SHORT"
          echo "Commit message: $LATEST_MSG"

          echo "LATEST_SHA=$LATEST_SHA" >> $GITHUB_ENV
          echo "LATEST_SHA_SHORT=$LATEST_SHA_SHORT" >> $GITHUB_ENV
          echo "LATEST_MSG<<EOF" >> $GITHUB_ENV
          echo "$LATEST_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "latest_sha_short=$LATEST_SHA_SHORT" >> $GITHUB_OUTPUT
          echo "latest_msg=$LATEST_MSG" >> $GITHUB_OUTPUT

          # Fetch tags for this commit
          git clone --depth 1 https://github.com/swiftlang/swift-book.git swift-book-tags
          cd swift-book-tags
          git fetch --tags --depth 1
          TAG_NAME=$(git tag --points-at $LATEST_SHA | head -n 1)
          cd ..
          rm -rf swift-book-tags

          echo "Tag name: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          if [ -n "$TAG_NAME" ]; then
            TAG_DIR_PATH=$(echo "$TAG_NAME" | sed -E 's/^swift-//; s/^([0-9]+)(-)/\1.0\2/; s/-(fcs|beta-.*)/\/\1/')
            echo "Tag directory path: $TAG_DIR_PATH"
          else
            TAG_DIR_PATH=""
          fi
          echo "tag_dir_path=$TAG_DIR_PATH" >> $GITHUB_OUTPUT

          LATEST_DATE=$(echo "$COMMIT_JSON" | jq -r '.commit.committer.date // .commit.author.date' | cut -dT -f1)
          echo "LATEST_DATE=$LATEST_DATE" >> $GITHUB_ENV
          echo "latest_date=$LATEST_DATE" >> $GITHUB_OUTPUT

  build-pdf:
    needs: generate-pdfs
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update main branch and tags
        run: git checkout main && git pull --tags origin main

      - name: Download swift-book repo at commit
        env:
          SHA: ${{ needs.generate-pdfs.outputs.target_sha }}
        run: |
          git clone https://github.com/swiftlang/swift-book.git swift-book-repo
          cd swift-book-repo
          git checkout "$SHA"

      - name: Download SF Pro Fonts DMG
        run: curl -L -o SF-Pro.dmg https://developer.apple.com/download/files/SF-Pro.dmg

      - name: Mount DMG and install SF Pro fonts
        run: |
          hdiutil attach SF-Pro.dmg -mountpoint /Volumes/SFPro
          sudo installer -pkg "/Volumes/SFPro/SF Pro Fonts.pkg" -target /
          hdiutil detach /Volumes/SFPro

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install swift-book-pdf

      - name: Install TeX Live (cached)
        uses: actions/cache@v4
        with:
          path: |
            ~/texlive
            ~/.texlive2025
          key: texlive-2025-${{ runner.os }}-${{ hashFiles('.github/workflows/generate-swift-book-pdfs.yml') }}
          restore-keys: |
            texlive-2025-${{ runner.os }}-

      - name: Install TeX Live and required packages
        run: |
          set -e
          YEAR=2025
          TEXDIR="$HOME/texlive/${YEAR}"
          export PATH="$TEXDIR/bin/universal-darwin:$PATH"
          if ! command -v tlmgr >/dev/null 2>&1; then
            curl -L -o install-tl-unx.tar.gz http://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
            tar -xzf install-tl-unx.tar.gz
            INSTALL_DIR=$(find . -maxdepth 1 -type d -name 'install-tl-*' | head -n 1)
            cd "$INSTALL_DIR"
            printf '%s\n' \
              'selected_scheme scheme-small' \
              "TEXDIR $TEXDIR" \
              "TEXMFCONFIG $HOME/.texlive2025/texmf-config" \
              "TEXMFHOME $HOME/texmf" \
              "TEXMFLOCAL $HOME/texlive/texmf-local" \
              "TEXMFSYSCONFIG $TEXDIR/texmf-config" \
              "TEXMFSYSVAR $TEXDIR/texmf-var" \
              "TEXMFVAR $HOME/.texlive2025/texmf-var" \
              'option_doc 0' \
              'option_src 0' \
              > texlive.profile
            ./install-tl -profile texlive.profile
            cd ..
          fi
          tlmgr update --self || true
          REQUIRED_PKGS="fontspec xcolor graphics fancyhdr geometry adjustbox ifoddpage enumitem listings minted tcolorbox pgf needspace hyperref parskip tabulary ragged2e footmisc lua-ul pdfcol tikzfill bigfoot"
          tlmgr install $REQUIRED_PKGS || true
          tlmgr path add
          echo "$TEXDIR/bin/universal-darwin" >> $GITHUB_PATH

      - name: Generate PDFs
        run: |
          mkdir -p archive

          run_quiet() {
            if [ "$ACTIONS_STEP_DEBUG" = "true" ]; then
              "$@"
            else
              "$@" > /dev/null 2>&1
            fi
          }

          echo "Generating digital light mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo --no-gutter archive/latest/swift_book_digital.pdf

          echo "Generating print light mode PDF..."
          run_quiet swift_book_pdf -i ./swift-book-repo --mode print --no-gutter archive/latest/swift_book_print.pdf

          if [ -n "${{ needs.generate-pdfs.outputs.tag_dir_path }}" ]; then
            TAG_DIR="archive/${{ needs.generate-pdfs.outputs.tag_dir_path }}"
            mkdir -p "$TAG_DIR"
            cp archive/latest/*.pdf "$TAG_DIR"/
            echo "Also copied PDFs to $TAG_DIR"
          fi

          echo "All PDFs generated successfully!"

      - name: Update release manifest
        run: python3 .github/automation/scripts/update-release-manifest.py --sha "$LATEST_SHA" --upstream-repo swift-book-repo

      - name: Regenerate README index
        run: python3 .github/automation/scripts/generate-index.py

      - name: Regenerate folder READMEs
        run: python3 .github/automation/scripts/generate-folder-readmes.py

      - name: Commit and push PDFs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive/latest/*.pdf || true
          if [ -n "${{ needs.generate-pdfs.outputs.tag_dir_path }}" ]; then
            git add "archive/${{ needs.generate-pdfs.outputs.tag_dir_path }}"/*.pdf || true
          fi
          git add archive/README.md archive/*/README.md archive/*/*/README.md || true
          git add .github/automation/releases.json README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            COMMIT_MSG=$(printf "Swift Book upstream: %s\n%s\n\nUpstream commit: https://github.com/swiftlang/swift-book/commit/%s" "$LATEST_SHA_SHORT" "$LATEST_MSG" "$LATEST_SHA")
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag commit if upstream is tagged
        if: needs.generate-pdfs.outputs.tag_name != ''
        run: |
          git tag "${{ needs.generate-pdfs.outputs.tag_name }}"
          git push origin "${{ needs.generate-pdfs.outputs.tag_name }}"

      - name: Create release and upload book files if upstream is tagged
        if: needs.generate-pdfs.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-pdfs.outputs.tag_name }}
          name: ${{ needs.generate-pdfs.outputs.tag_name }}
          body: |
            Release for Swift Book upstream tag ${{ needs.generate-pdfs.outputs.tag_name }}

            https://github.com/swiftlang/swift-book/releases/tag/${{ needs.generate-pdfs.outputs.tag_name }}
          files: |
            archive/${{ needs.generate-pdfs.outputs.tag_dir_path }}/swift_book_digital.pdf
            archive/${{ needs.generate-pdfs.outputs.tag_dir_path }}/swift_book_print.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
